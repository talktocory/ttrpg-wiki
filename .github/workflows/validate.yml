name: Validate framework

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      build_template:
        description: Build a release from this blank template checkout
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/sync_adapters.py --check
      - run: python scripts/validate.py
      - run: python -m unittest discover -s tests -v

  build-template:
    name: Build blank campaign template
    needs: validate
    if: github.event_name == 'workflow_dispatch' && inputs.build_template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/build_release.py
      - uses: actions/upload-artifact@v6
        with:
          name: ttrpg-wiki-template
          path: dist/ttrpg-wiki-template.zip
          if-no-files-found: error
